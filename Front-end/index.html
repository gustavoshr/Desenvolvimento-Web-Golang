// indirect


{{define "Index"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
    {{template "nav" .}}
    <div class="container">
        <section class="card">
            <div>
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .}}
                        <tr>
                            <td>{{.Name}}</td>
                            <td>{{.Description}}</td>
                            <td>{{.Price}}</td>
                            <td>{{.Quantity}}</td>
                            <td><a href="/edit?id={{.ID}}" class="btn btn-info">Edit</a></td>
                            <td><button onclick="onDelete('{{.ID}}')" class="btn btn-danger">Delete</button></td>
                        </tr>
                       {{end}}
                    </tbody>
                </table>
            </div>
        </section>

        <div class="card-footer">
            <a href="/new" class="btn btn-primary mb-2">New Products</a>
        </div>

    </div>
</body>

<script>
    function onDelete(id) {
        let response = confirm("Do you want to delete this product?")
        if (response) {
            window.location = "/delete?id=" + id
        }
    }

    func
</script>

</html>
{{end}}
